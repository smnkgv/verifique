[package]
name = "verifique-panel"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A status-bar panel for verifique. It reads the CLI's JSON and acts only through the CLI."

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
strip = true
