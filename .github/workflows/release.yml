# Every build of verifique and its plugins, put in a draft release that only a person publishes.
name: release

on:
    workflow_dispatch:
        inputs:
            draft:
                description: Put the builds in a draft release (off to only test the builds)
                type: boolean
                default: true

permissions:
    contents: write

# A newer run replaces one still going.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: macos-15, target: aarch64-apple-darwin, name: macos-arm64 }
                    - { os: macos-15, target: x86_64-apple-darwin, name: macos-x64 }
                    - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, name: linux-x64 }
                    - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux-arm64 }
                    - { os: windows-2025, target: x86_64-pc-windows-msvc, name: windows-x64 }
                    - { os: windows-11-arm, target: aarch64-pc-windows-msvc, name: windows-arm64 }
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        env:
            # The Mac panel is signed and notarized once the Apple secrets exist, and left unsigned before.
            CAN_NOTARIZE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_API_KEY != '' }}
        steps:
            - uses: actions/checkout@v5
            - name: Rust
              run: |
                  if ! command -v rustup >/dev/null; then
                      if [ "$RUNNER_OS" = Windows ]; then
                          arch=$([ "$RUNNER_ARCH" = ARM64 ] && echo aarch64 || echo x86_64)
                          curl -sSfLo rustup-init.exe "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe"
                          ./rustup-init.exe -y --profile minimal --default-toolchain none
                      else
                          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
                      fi
                      echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                      export PATH="$HOME/.cargo/bin:$PATH"
                  fi
                  rustup toolchain install stable --profile minimal
                  rustup default stable
            - run: rustup target add ${{ matrix.target }}
            # Static builds, so one Linux build runs on any distribution.
            - if: runner.os == 'Linux'
              run: |
                  sudo apt-get install -y -qq musl-tools
                  echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"
            - run: cargo build --release --locked --workspace --target ${{ matrix.target }}
            - name: Package
              run: |
                  out="target/${{ matrix.target }}/release"
                  mkdir dist
                  if [ "$RUNNER_OS" = Windows ]; then
                      7z a -tzip "dist/verifique-${{ matrix.name }}.zip" "./$out/verifique.exe" "./$out/verifique-service.exe" >/dev/null
                      ext=.exe
                  else
                      tar -czf "dist/verifique-${{ matrix.name }}.tar.gz" -C "$out" verifique
                      ext=
                  fi
                  for plugin in postgres mongo redis; do
                      cp "$out/verifique-$plugin$ext" "dist/verifique-$plugin-${{ matrix.name }}$ext"
                  done
                  ls -l dist
            # The panel is a Cargo project of its own. On Linux it uses the system's WebKitGTK, so it is
            # built against the system's libraries rather than statically.
            - name: Panel libraries (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
            - name: Panel
              run: |
                  case "$RUNNER_OS" in
                  macOS)
                      sh panel/bundle.sh ${{ matrix.target }}
                      ditto -c -k --keepParent panel/target/verifique.app "dist/verifique-panel-${{ matrix.name }}.zip"
                      ;;
                  Windows)
                      (cd panel && cargo build --release --locked --target ${{ matrix.target }})
                      cp "panel/target/${{ matrix.target }}/release/verifique-panel.exe" "dist/verifique-panel-${{ matrix.name }}.exe"
                      ;;
                  Linux)
                      (cd panel && cargo build --release --locked)
                      cp panel/target/release/verifique-panel "dist/verifique-panel-${{ matrix.name }}"
                      ;;
                  esac
            - name: Sign and notarize the panel (macOS)
              if: runner.os == 'macOS' && env.CAN_NOTARIZE == 'true'
              env:
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
                  APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
                  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
              run: |
                  # A keychain of its own, gone with the runner.
                  keychain="$RUNNER_TEMP/signing.keychain-db"
                  password=$(openssl rand -hex 16)
                  security create-keychain -p "$password" "$keychain"
                  security set-keychain-settings -lut 21600 "$keychain"
                  security unlock-keychain -p "$password" "$keychain"
                  echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
                  security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
                  rm "$RUNNER_TEMP/certificate.p12"
                  security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
                  security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
                  identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | awk '{print $2}')
                  [ -n "$identity" ] || { echo "the certificate is not a Developer ID Application one"; exit 1; }
                  printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/notary.p8"
                  notarize() {
                      xcrun notarytool submit "$1" --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
                  }
                  app=panel/target/verifique.app
                  codesign --force --options runtime --timestamp --sign "$identity" "$app"
                  ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
                  notarize "$RUNNER_TEMP/notarize.zip"
                  xcrun stapler staple "$app"
                  rm "dist/verifique-panel-${{ matrix.name }}.zip"
                  ditto -c -k --keepParent "$app" "dist/verifique-panel-${{ matrix.name }}.zip"
                  # For people who download it in a browser, or through the Homebrew cask.
                  dmg="dist/verifique-panel-${{ matrix.name }}.dmg"
                  hdiutil create -volname verifique -srcfolder "$app" -ov -format UDZO "$dmg"
                  codesign --force --timestamp --sign "$identity" "$dmg"
                  notarize "$dmg"
                  xcrun stapler staple "$dmg"
                  rm "$RUNNER_TEMP/notary.p8"
                  security delete-keychain "$keychain"
            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.name }}
                  path: dist/*

    draft:
        if: inputs.draft
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true
            - name: Draft the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
                  (cd dist && sha256sum * > SHA256SUMS)
                  notes="docs/releases/v$version.md"
                  [ -f "$notes" ] || notes=/dev/null
                  gh release create "v$version" dist/* --draft --target "$GITHUB_SHA" --title "verifique $version" --notes-file "$notes"
