name: release

on:
    push:
        tags: ["v*"]

permissions:
    contents: write

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
                    - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64 }
                    - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
                    - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - run: rustup target add ${{ matrix.target }}
            - run: cargo build --release --locked --target ${{ matrix.target }}
            - run: tar -czf verifique-${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release verifique
            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.name }}
                  path: verifique-${{ matrix.name }}.tar.gz

    publish:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  merge-multiple: true
            - run: gh release create "$GITHUB_REF_NAME" verifique-*.tar.gz --title "$GITHUB_REF_NAME" --notes-file docs/releases/"$GITHUB_REF_NAME".md
              env:
                  GH_TOKEN: ${{ github.token }}
