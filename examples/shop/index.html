<!doctype html>
<meta charset="utf-8">
<title>Your shop</title>
<style>
body { font: 16px -apple-system, Helvetica, sans-serif; margin: 40px auto; max-width: 720px; color: #1c1d1c; }
form { display: flex; gap: 8px; margin: 20px 0; }
input { flex: 1; padding: 10px; font: inherit; }
button { padding: 10px 18px; font: inherit; background: #16894d; color: white; border: 0; border-radius: 6px; }
ul { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0; list-style: none; }
li { padding: 16px; border: 1px solid #ddd; border-radius: 8px; }
</style>
<h1>Your shop</h1>
<form id="search"><input id="q" placeholder="Search products" aria-label="Search"><button>Search</button></form>
<ul id="products"></ul>
<script>
const PRODUCTS = ["Red shoes", "Blue shoes", "Red scarf", "Green hat", "Black boots", "White socks"];
const list = document.getElementById("products");
function show(items) { list.innerHTML = items.map((p) => `<li>${p}</li>`).join(""); }
show(PRODUCTS);
document.getElementById("search").onsubmit = () => false;
document.getElementById("search").addEventListener("reset", (event) => {
    event.preventDefault();
    const q = document.getElementById("q").value.toLowerCase();
    show(PRODUCTS.filter((p) => p.toLowerCase().includes(q)));
});
</script>
