stacks:
    web:
        apps:
            shop:
                # Python 3 answers to python3 on macOS and Linux, and to python on Windows.
                run: 'if python3 -c "" 2>/dev/null; then exec python3 server.py; else exec python server.py; fi'
                port: 4200
                ready: /
                env:
                    PORT: "{port}"

checks:
    manual:
        type: agent
        stack: web
        agent: claude
        notes: The shop is one page. Search filters the product list when you press the Search button.
